---
- name: Stop MongoDB service
  ansible.builtin.systemd_service:
    name: mongod
    state: stopped

- name: Verify MongoDB is stopped
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - mongod
  register: mongodb_stop_status
  changed_when: false
  failed_when: mongodb_stop_status.stdout | trim != "inactive"

- name: Report stop result
  ansible.builtin.debug:
    msg: "MongoDB STOP test PASSED"

- name: Start MongoDB service
  ansible.builtin.systemd_service:
    name: mongod
    state: started

- name: Wait for MongoDB after start
  ansible.builtin.wait_for:
    host: "{{ mongodb_bind_ip }}"
    port: "{{ mongodb_port }}"
    state: started
    timeout: 30

- name: Report start result
  ansible.builtin.debug:
    msg: "MongoDB START test PASSED"

- name: Restart MongoDB service
  ansible.builtin.systemd_service:
    name: mongod
    state: restarted

- name: Wait for MongoDB after restart
  ansible.builtin.wait_for:
    host: "{{ mongodb_bind_ip }}"
    port: "{{ mongodb_port }}"
    state: started
    timeout: 30

- name: Verify MongoDB autostart is enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - mongod
  register: mongodb_enabled_status
  changed_when: false
  failed_when: mongodb_enabled_status.stdout | trim != "enabled"

- name: Report restart and autostart result
  ansible.builtin.debug:
    msg: "MongoDB RESTART test PASSED; autostart is ENABLED"
