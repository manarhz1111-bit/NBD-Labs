---
- name: Wait until MongoDB accepts TCP connections
  ansible.builtin.wait_for:
    host: "{{ mongodb_bind_ip }}"
    port: "{{ mongodb_port }}"
    state: started
    timeout: 30

- name: Ping MongoDB using mongosh
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --host
      - "{{ mongodb_bind_ip }}"
      - --port
      - "{{ mongodb_port | string }}"
      - --eval
      - "db.adminCommand({ ping: 1 }).ok"
  register: mongodb_ping
  changed_when: false

- name: Verify MongoDB ping result
  ansible.builtin.assert:
    that:
      - mongodb_ping.stdout | trim == "1"
    success_msg: "MongoDB health check PASSED"
    fail_msg: "MongoDB health check FAILED"

- name: Report MongoDB availability
  ansible.builtin.debug:
    msg: "MongoDB is AVAILABLE on {{ mongodb_bind_ip }}:{{ mongodb_port }}"
