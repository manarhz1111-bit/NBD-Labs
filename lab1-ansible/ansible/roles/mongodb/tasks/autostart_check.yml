---
# Run right after a real reboot of the VM:
#   sudo reboot
#   ansible-playbook lab1.yml --tags part1_autostart_check
# It proves that systemd started mongod at boot without any manual command.

- name: Read system boot time
  ansible.builtin.command:
    argv:
      - uptime
      - --since
  register: system_boot_time
  changed_when: false

- name: Read MongoDB unit state and start time
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - mongod
      - --property=ActiveState,UnitFileState,ActiveEnterTimestamp
  register: mongodb_boot_state
  changed_when: false

- name: Verify MongoDB is enabled and running
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in mongodb_boot_state.stdout"
      - "'UnitFileState=enabled' in mongodb_boot_state.stdout"
    success_msg: "AUTOSTART VERIFIED: mongod is enabled and running"
    fail_msg: "mongod is not enabled or not running"

- name: Ping MongoDB after boot
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --host
      - "{{ mongodb_bind_ip }}"
      - --port
      - "{{ mongodb_port | string }}"
      - --eval
      - "db.adminCommand({ ping: 1 }).ok"
  register: mongodb_boot_ping
  changed_when: false
  failed_when: mongodb_boot_ping.stdout | trim != "1"

- name: Report boot and MongoDB start times
  ansible.builtin.debug:
    msg:
      - "System booted at: {{ system_boot_time.stdout | trim }}"
      - "{{ mongodb_boot_state.stdout_lines | select('match', '^ActiveEnterTimestamp=') | first }}"
      - "MongoDB answers ping after boot: {{ mongodb_boot_ping.stdout | trim }}"
      - "If both times are seconds apart, mongod was started by systemd during boot"
