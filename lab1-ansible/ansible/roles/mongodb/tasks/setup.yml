---
- name: Install packages required for MongoDB repository management
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true

- name: Configure official MongoDB 9.0 APT repository
  ansible.builtin.deb822_repository:
    name: mongodb-org-9.0
    types:
      - deb
    uris:
      - https://repo.mongodb.org/apt/ubuntu
    suites:
      - "{{ mongodb_apt_distribution }}/mongodb-org/{{ mongodb_major_version }}"
    components:
      - multiverse
    architectures:
      - amd64
    signed_by: https://pgp.mongodb.com/server-9.asc
    enabled: true
    state: present
    install_python_debian: true
  register: mongodb_repository

- name: Update APT cache after adding MongoDB repository
  ansible.builtin.apt:
    update_cache: true
  when: mongodb_repository.changed

- name: Install latest MongoDB Community packages from 9.0 repository
  ansible.builtin.apt:
    name: mongodb-org
    state: latest
    update_cache: true

- name: Check whether initial MongoDB administrator exists
  ansible.builtin.stat:
    path: "{{ mongodb_admin_marker_path }}"
  register: mongodb_admin_marker_setup

- name: Deploy MongoDB configuration managed by Ansible
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    mongodb_effective_authorization: >-
      {{
        (mongodb_authorization_enabled | bool)
        and
        (mongodb_admin_marker_setup.stat.exists | bool)
      }}
  notify: Restart MongoDB

- name: Enable MongoDB automatic startup and start the service
  ansible.builtin.systemd_service:
    name: mongod
    enabled: true
    state: started

- name: Apply pending MongoDB handler immediately
  ansible.builtin.meta: flush_handlers

- name: Wait for MongoDB to listen on port
  ansible.builtin.wait_for:
    host: "{{ mongodb_bind_ip }}"
    port: "{{ mongodb_port }}"
    state: started
    timeout: 30
