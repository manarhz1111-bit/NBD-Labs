---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart MongoDB Exporter
  ansible.builtin.systemd_service:
    name: mongodb_exporter
    state: restarted

- name: Restart Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
