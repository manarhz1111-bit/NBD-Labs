---
- name: Ensure Prometheus system group exists
  ansible.builtin.group:
    name: prometheus
    system: true
    state: present

- name: Ensure Prometheus system user exists
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Download Prometheus {{ prometheus_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    checksum: "sha256:2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"
    mode: "0644"

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Install Prometheus binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
    dest: /usr/local/bin/prometheus
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install promtool binary
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/promtool"
    dest: /usr/local/bin/promtool
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: "0640"
  notify: Restart Prometheus

- name: Validate Prometheus configuration
  ansible.builtin.command:
    argv:
      - /usr/local/bin/promtool
      - check
      - config
      - /etc/prometheus/prometheus.yml
  register: prometheus_config_check
  changed_when: false

- name: Verify Prometheus configuration validation
  ansible.builtin.assert:
    that:
      - prometheus_config_check.rc == 0
    success_msg: "PROMETHEUS CONFIG VERIFIED"

- name: Deploy Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Prometheus handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for Prometheus port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ prometheus_port }}"
    state: started
    timeout: 30

- name: Wait for MongoDB target to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/targets"
    return_content: true
    status_code: 200
  register: prometheus_targets
  until:
    - "'mongodb' in prometheus_targets.content"
    - "'up' in prometheus_targets.content"
  retries: 10
  delay: 3

- name: Verify MongoDB exporter target is UP in Prometheus
  ansible.builtin.assert:
    that:
      - "('127.0.0.1:' ~ mongodb_exporter_port) in prometheus_targets.content"
      - "'\"health\":\"up\"' in prometheus_targets.content"
    success_msg: "PROMETHEUS VERIFIED: MongoDB target 127.0.0.1:{{ mongodb_exporter_port }} is UP"
    fail_msg: "Prometheus is running but MongoDB exporter target is not UP"

- name: Report Prometheus status
  ansible.builtin.debug:
    msg:
      - "Prometheus version: {{ prometheus_version }}"
      - "Prometheus URL: http://127.0.0.1:{{ prometheus_port }}"
      - "MongoDB scrape target: 127.0.0.1:{{ mongodb_exporter_port }}"
      - "Prometheus service is ACTIVE and ENABLED"
