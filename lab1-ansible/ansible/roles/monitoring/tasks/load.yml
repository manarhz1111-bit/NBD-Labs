---
- name: Deploy MongoDB load generator
  ansible.builtin.template:
    src: mongodb-load.py.j2
    dest: /usr/local/bin/mongodb-lab1-load.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy secure MongoDB load environment
  ansible.builtin.template:
    src: mongodb-load.env.j2
    dest: /etc/default/mongodb-lab1-load
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy MongoDB load generator systemd service
  ansible.builtin.template:
    src: mongodb-load.service.j2
    dest: /etc/systemd/system/mongodb-lab1-load.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd for load generator
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start MongoDB load generation
  ansible.builtin.systemd_service:
    name: mongodb-lab1-load
    state: restarted

- name: Wait for load generator to enter running state
  ansible.builtin.pause:
    seconds: 3

- name: Check MongoDB load generator state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - mongodb-lab1-load
  register: mongodb_load_state
  changed_when: false

- name: Verify MongoDB load generator is running
  ansible.builtin.assert:
    that:
      - mongodb_load_state.stdout | trim == "active"
    success_msg: "LOAD GENERATOR VERIFIED: MongoDB workload is RUNNING"

- name: Report MongoDB load test
  ansible.builtin.debug:
    msg:
      - "MongoDB load generation started"
      - "Duration: {{ mongodb_load_duration }} seconds"
      - "Target database: {{ mongodb_training_db }}"
      - "Collection: load_test"
      - "Open Grafana now and observe Operations/sec and Network Traffic"
