---
- name: Create MongoDB monitoring user
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    database: admin
    name: "{{ mongodb_monitor_user }}"
    password: "{{ vault_monitor_password }}"
    roles:
      - db: admin
        role: clusterMonitor
      - db: local
        role: read
    state: present
    update_password: on_create
  vars:
    ansible_python_interpreter: /opt/ansible-mongodb/bin/python
  no_log: true

- name: Read MongoDB monitoring user roles
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    db: admin
    eval: >-
      db.runCommand({
        usersInfo: {user: "{{ mongodb_monitor_user }}", db: "admin"}
      }).users[0].roles.map(r => r.role + "@" + r.db).sort()
    stringify: true
    transform: json
  register: monitoring_user_roles
  changed_when: false
  no_log: true

- name: Verify monitoring user roles
  ansible.builtin.assert:
    that:
      - "'clusterMonitor@admin' in (monitoring_user_roles.transformed_output | string)"
      - "'read@local' in (monitoring_user_roles.transformed_output | string)"
    success_msg: "MONITOR USER VERIFIED: clusterMonitor@admin and read@local"

- name: Report monitoring user
  ansible.builtin.debug:
    msg: "MongoDB monitoring user {{ mongodb_monitor_user }} is ready for mongodb_exporter"
