---
- name: Generate unique timestamp for all-databases backup
  ansible.builtin.command:
    argv:
      - date
      - "+%Y%m%d_%H%M%S_%3N"
  register: all_backup_timestamp
  changed_when: false

- name: Define all-databases backup directory
  ansible.builtin.set_fact:
    mongodb_all_backup_dir: >-
      {{ mongodb_backup_root }}/all-{{ all_backup_timestamp.stdout }}

- name: Create timestamped directory for all training databases
  ansible.builtin.file:
    path: "{{ mongodb_all_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Back up and verify all training databases
  block:
    - name: Create secure temporary MongoDB tools credential file
      ansible.builtin.copy:
        dest: /run/lab1-mongodb-tools.yml
        content: |
          password: {{ vault_mongodb_admin_password | to_json }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Back up every training database
      ansible.builtin.command:
        argv:
          - mongodump
          - --host=127.0.0.1
          - "--port={{ mongodb_port }}"
          - "--username={{ mongodb_admin_user }}"
          - --authenticationDatabase=admin
          - --config=/run/lab1-mongodb-tools.yml
          - "--db={{ item }}"
          - "--archive={{ mongodb_all_backup_dir }}/{{ item }}.archive.gz"
          - --gzip
      loop: "{{ mongodb_training_databases }}"

    - name: Verify every training database archive is readable
      ansible.builtin.command:
        argv:
          - mongorestore
          - --host=127.0.0.1
          - "--port={{ mongodb_port }}"
          - "--username={{ mongodb_admin_user }}"
          - --authenticationDatabase=admin
          - --config=/run/lab1-mongodb-tools.yml
          - "--archive={{ mongodb_all_backup_dir }}/{{ item }}.archive.gz"
          - --gzip
          - "--nsInclude={{ item }}.*"
          - --dryRun
      loop: "{{ mongodb_training_databases }}"
      changed_when: false

    - name: Read generated archive information
      ansible.builtin.stat:
        path: "{{ mongodb_all_backup_dir }}/{{ item }}.archive.gz"
      loop: "{{ mongodb_training_databases }}"
      register: all_backup_files

    - name: Verify all backup archives exist and are non-empty
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size | int > 0
        success_msg: "BACKUP VERIFIED: {{ item.item }}"
        fail_msg: "BACKUP FAILED: {{ item.item }}"
      loop: "{{ all_backup_files.results }}"

    - name: Report all training databases backup
      ansible.builtin.debug:
        msg:
          - "ALL TRAINING DATABASES BACKUP VERIFIED"
          - "Backup directory: {{ mongodb_all_backup_dir }}"
          - "Databases: {{ mongodb_training_databases | join(', ') }}"

  always:
    - name: Remove temporary MongoDB tools credential file
      ansible.builtin.file:
        path: /run/lab1-mongodb-tools.yml
        state: absent
      no_log: true
