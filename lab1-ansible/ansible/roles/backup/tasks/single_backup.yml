---
- name: Generate unique timestamp for single database backup
  ansible.builtin.command:
    argv:
      - date
      - "+%Y%m%d_%H%M%S_%3N"
  register: single_backup_timestamp
  changed_when: false

- name: Define single database backup archive path
  ansible.builtin.set_fact:
    mongodb_single_backup_archive: >-
      {{ mongodb_backup_root }}/single-{{ mongodb_training_db }}-{{ single_backup_timestamp.stdout }}.archive.gz

- name: Create and verify single database backup
  block:
    - name: Create secure temporary MongoDB tools credential file
      ansible.builtin.copy:
        dest: /run/lab1-mongodb-tools.yml
        content: |
          password: {{ vault_mongodb_admin_password | to_json }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Back up one training database
      ansible.builtin.command:
        argv:
          - mongodump
          - --host=127.0.0.1
          - "--port={{ mongodb_port }}"
          - "--username={{ mongodb_admin_user }}"
          - --authenticationDatabase=admin
          - --config=/run/lab1-mongodb-tools.yml
          - "--db={{ mongodb_training_db }}"
          - "--archive={{ mongodb_single_backup_archive }}"
          - --gzip
      register: single_backup_result

    - name: Verify backup archive is readable
      ansible.builtin.command:
        argv:
          - mongorestore
          - --host=127.0.0.1
          - "--port={{ mongodb_port }}"
          - "--username={{ mongodb_admin_user }}"
          - --authenticationDatabase=admin
          - --config=/run/lab1-mongodb-tools.yml
          - "--archive={{ mongodb_single_backup_archive }}"
          - --gzip
          - "--nsInclude={{ mongodb_training_db }}.*"
          - --dryRun
      changed_when: false

    - name: Check single backup archive
      ansible.builtin.stat:
        path: "{{ mongodb_single_backup_archive }}"
      register: single_backup_file

    - name: Verify single database backup
      ansible.builtin.assert:
        that:
          - single_backup_file.stat.exists
          - single_backup_file.stat.size | int > 0
        success_msg: "SINGLE DATABASE BACKUP VERIFIED"

    - name: Report single database backup
      ansible.builtin.debug:
        msg:
          - "Database: {{ mongodb_training_db }}"
          - "Archive: {{ mongodb_single_backup_archive }}"
          - "Size: {{ single_backup_file.stat.size }} bytes"

  always:
    - name: Remove temporary MongoDB tools credential file
      ansible.builtin.file:
        path: /run/lab1-mongodb-tools.yml
        state: absent
      no_log: true
