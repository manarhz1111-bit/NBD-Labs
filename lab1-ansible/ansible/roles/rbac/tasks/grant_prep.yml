---
- name: Create grant-revoke demo user with reader role only
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    database: admin
    name: "{{ mongodb_grant_demo_user }}"
    password: "{{ vault_grant_demo_password }}"
    roles:
      - db: "{{ mongodb_training_db }}"
        role: "{{ mongodb_reader_role }}"
    state: present
    update_password: on_create
  vars:
    ansible_python_interpreter: /opt/ansible-mongodb/bin/python
  no_log: true

- name: Read initial demo user roles
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    db: admin
    eval: >-
      db.runCommand({
        usersInfo: {user: "{{ mongodb_grant_demo_user }}", db: "admin"}
      }).users[0].roles.map(r => r.role + "@" + r.db).sort()
    stringify: true
    transform: json
  register: demo_initial_roles
  changed_when: false
  no_log: true

- name: Verify demo user initially has reader role only
  ansible.builtin.assert:
    that:
      - "mongodb_reader_role in (demo_initial_roles.transformed_output | string)"
      - "mongodb_writer_role not in (demo_initial_roles.transformed_output | string)"
    success_msg: "Demo user VERIFIED with reader role only"
