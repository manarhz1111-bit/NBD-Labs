---
- name: Seed university training database
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    db: "{{ mongodb_training_db }}"
    eval: |
      db.students.updateOne(
        { student_id: 1 },
        { $set: { name: "Alice", group: "NBD" } },
        { upsert: true }
      );
      db.courses.updateOne(
        { course_id: 1 },
        { $set: { title: "Non-relational Databases" } },
        { upsert: true }
      );
      db.grades.updateOne(
        { student_id: 1, course_id: 1 },
        { $set: { grade: 5 } },
        { upsert: true }
      );
    stringify: false
  no_log: true

- name: Seed library training database
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    db: "{{ mongodb_library_db }}"
    eval: |
      db.books.updateOne(
        { isbn: "LAB1-001" },
        { $set: { title: "MongoDB Lab Book", available: true } },
        { upsert: true }
      );
    stringify: false
  no_log: true

- name: Report training databases
  ansible.builtin.debug:
    msg:
      - "Training database ready: {{ mongodb_training_db }}"
      - "Training database ready: {{ mongodb_library_db }}"
