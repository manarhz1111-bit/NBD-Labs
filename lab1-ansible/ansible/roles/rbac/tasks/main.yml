---
- name: Prepare Python environment for MongoDB modules
  ansible.builtin.import_tasks: prerequisites.yml
  tags:
    - part2
    - part2_prerequisites

- name: Bootstrap initial MongoDB administrator
  ansible.builtin.import_tasks: bootstrap_admin.yml
  tags:
    - part2
    - part2_bootstrap_admin

- name: Enable and verify MongoDB authorization
  ansible.builtin.import_tasks: enable_auth.yml
  tags:
    - part2
    - part2_enable_auth

- name: Prepare training databases
  ansible.builtin.import_tasks: seed_databases.yml
  tags:
    - part2
    - part2_seed

- name: Create MongoDB custom roles
  ansible.builtin.import_tasks: create_roles.yml
  tags:
    - part2
    - part2_roles

- name: Create MongoDB training users
  ansible.builtin.import_tasks: create_users.yml
  tags:
    - part2
    - part2_users

- name: Verify base MongoDB RBAC objects
  ansible.builtin.import_tasks: verify_base.yml
  tags:
    - part2
    - part2_verify_base

- name: Verify that roles allow and deny different operations
  ansible.builtin.import_tasks: verify_permissions.yml
  tags:
    - part2
    - part2_verify_permissions

- name: Prepare user for grant and revoke demonstration
  ansible.builtin.import_tasks: grant_prep.yml
  tags:
    - part2
    - part2_grant_prep

- name: Grant role to MongoDB user
  ansible.builtin.import_tasks: grant_role.yml
  tags:
    - part2
    - part2_grant

- name: Revoke role from MongoDB user
  ansible.builtin.import_tasks: revoke_role.yml
  tags:
    - part2
    - part2_revoke

- name: Modify permissions of an existing MongoDB role
  ansible.builtin.import_tasks: update_role.yml
  tags:
    - part2
    - part2_role_update

- name: Configure collection-only MongoDB access
  ansible.builtin.import_tasks: collection_only.yml
  tags:
    - part2
    - part2_collection_only

- name: Demonstrate MongoDB user and role deletion
  ansible.builtin.import_tasks: delete_demo.yml
  tags:
    - part2
    - part2_delete
