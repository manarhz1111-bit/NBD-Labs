---
- name: Check administrator bootstrap marker before enabling authorization
  ansible.builtin.stat:
    path: "{{ mongodb_admin_marker_path }}"
  register: mongodb_admin_marker_auth

- name: Refuse to enable authorization without administrator
  ansible.builtin.assert:
    that:
      - mongodb_admin_marker_auth.stat.exists
    success_msg: "Administrator bootstrap verified - authorization can be enabled"
    fail_msg: "Refusing to enable authorization: administrator is missing"

- name: Deploy MongoDB configuration with authorization enabled
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/mongodb/templates/mongod.conf.j2"
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    mongodb_effective_authorization: true
  register: mongodb_auth_config

- name: Restart MongoDB after enabling authorization
  ansible.builtin.systemd_service:
    name: mongod
    state: restarted
    enabled: true
  when: mongodb_auth_config.changed

- name: Ensure MongoDB is running
  ansible.builtin.systemd_service:
    name: mongod
    state: started
    enabled: true

- name: Wait for MongoDB after enabling authorization
  ansible.builtin.wait_for:
    host: "{{ mongodb_bind_ip }}"
    port: "{{ mongodb_port }}"
    state: started
    timeout: 30

- name: Test privileged operation without authentication
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --host
      - "127.0.0.1"
      - --port
      - "{{ mongodb_port | string }}"
      - --eval
      - |
        try {
          db.getSiblingDB("admin").getUsers();
          print("UNEXPECTED_ACCESS");
        } catch (e) {
          print("ACCESS_DENIED");
        }
  register: mongodb_unauthenticated_test
  changed_when: false

- name: Verify unauthenticated privileged access is denied
  ansible.builtin.assert:
    that:
      - "'ACCESS_DENIED' in mongodb_unauthenticated_test.stdout"
      - "'UNEXPECTED_ACCESS' not in mongodb_unauthenticated_test.stdout"
    success_msg: "Unauthenticated privileged access is DENIED"
    fail_msg: "Authorization verification FAILED"

- name: Verify administrator authentication
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    database: admin
    name: "{{ mongodb_admin_user }}"
    password: "{{ vault_mongodb_admin_password }}"
    roles:
      - db: admin
        role: root
    state: present
    update_password: on_create
  vars:
    ansible_python_interpreter: /opt/ansible-mongodb/bin/python
  no_log: true

- name: Report authorization result
  ansible.builtin.debug:
    msg: "MongoDB authorization is ENABLED; administrator authentication works"
