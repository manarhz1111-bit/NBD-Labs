---
- name: Revoke writer role from demo user
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    database: admin
    name: "{{ mongodb_grant_demo_user }}"
    password: "{{ vault_grant_demo_password }}"
    roles:
      - db: "{{ mongodb_training_db }}"
        role: "{{ mongodb_reader_role }}"
    state: present
    update_password: on_create
  vars:
    ansible_python_interpreter: /opt/ansible-mongodb/bin/python
  no_log: true

- name: Read roles after revoke
  community.mongodb.mongodb_shell:
    login_host: "127.0.0.1"
    login_port: "{{ mongodb_port }}"
    login_database: admin
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ vault_mongodb_admin_password }}"
    db: admin
    eval: >-
      db.runCommand({
        usersInfo: {user: "{{ mongodb_grant_demo_user }}", db: "admin"}
      }).users[0].roles.map(r => r.role + "@" + r.db).sort()
    stringify: true
    transform: json
  register: demo_roles_after_revoke
  changed_when: false
  no_log: true

- name: Verify writer role was revoked
  ansible.builtin.assert:
    that:
      - "mongodb_reader_role in (demo_roles_after_revoke.transformed_output | string)"
      - "mongodb_writer_role not in (demo_roles_after_revoke.transformed_output | string)"
    success_msg: "REVOKE VERIFIED: writer role was removed and reader role remains"

- name: Report revoke result
  ansible.builtin.debug:
    msg: "Role REVOKE completed by Ansible: {{ mongodb_writer_role }} removed from {{ mongodb_grant_demo_user }}"
